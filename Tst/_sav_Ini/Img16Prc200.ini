; optic 8-bit from GoogleTopcoder "barcode recognition" ~2010
; ~"1280 960 x1280x0960bar/001.raw 200 0888 24"
; 8-bit isn't a normal input for this utility. This is limited sample
; to sharpen barcode (for automatic recognition). It doesn't target to
; improve "visual quality".

[Settings]
nCUDA=0; -1:no, 0:auto, 1:mandatory
nPrintLabel=0; -1:neg, 0:no, 1:pos (*GC.nInvert)
nPyrMxXY=0 0; dnsmpl_sh_mx_X _Y
nShrShu=0; ShiftRight
nIniSetDflt=0; 0:no, 1:yes

[BH]
;beam hardening ("BeaHar" in code-identifiers)
nEnabled=0

[TL]
;suppress thin & long cartesian laplacians ("ThLoLap" in code-identifiers)
a=0; bEn nRadX nRadY fAtt
b=0;
c=0
d=0

[GC]
;global gray-scale-cut ("GrayCut" in code-identifiers)
nEnabled=1
nInvert=0
nGamInpOut=256 4192
fCutDrkBrt=0.000 0.000
fGamma=0.0

[CO]
;Collimator detection
nEnabled=0

[RD]
;Ribs detection
nEnabled=0

[AE]
;estimate background,air in parallel ("AirEstimation" in code-identifiers)
nEnabled=0

[QL]
;quadrature laplacians ("QuadLaps" in code-identifiers)
nEnabled=0

[ME]
;Mask re-estimation (long lines)
nEnabled=0

[US]
;unsharp ("US" in code-identifiers)
nEnabled=1
